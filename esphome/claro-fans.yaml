# Claro Whisper DC ceiling fans — ESPHome control (2 fans, RX+TX)
#
# STATUS: FIRST DRAFT — written without the CC1101 in hand. Every pin, the CC1101
# schema, and especially the two lambdas MUST be validated on hardware when the
# module arrives. See esphome/README.md for the flashing + verification checklist.
#
# Protocol (see ../PROTOCOL.md): 433.92 MHz OOK PWM, 33-bit frame
#   [16-bit address][8-bit command][8-bit checksum][stop bit = 1]
#   checksum = addr_hi XOR addr_lo XOR command
#   bit '1' = 1192us mark + 380us space ; bit '0' = 412us mark + 1164us space
#   ~11.9 ms inter-frame gap, frame repeated ~4-6x per press. Fixed code (replayable).

substitutions:
  name: claro-fans
  friendly_name: Claro Fans
  # Per-fan 16-bit addresses, decoded from the factory remotes.
  addr_fan_a: "0x3123"   # Fan A remote
  addr_fan_b: "0x9221"   # Fan B remote

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.12.0   # cc1101 component landed as a core component here

esp32:
  board: esp32-c3-devkitm-1   # ESP32-C3 SuperMini
  framework:
    type: esp-idf

logger:
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# ---------------------------------------------------------------------------
# Radio: CC1101 on hardware SPI, dual-pin wiring for simultaneous RX + TX.
#   CC1101  ->  ESP32-C3 SuperMini
#   VCC     ->  3V3   (3.3 V ONLY — 5 V destroys the CC1101)
#   GND     ->  GND
#   SCK     ->  GPIO4
#   MISO    ->  GPIO5
#   MOSI    ->  GPIO6
#   CSN     ->  GPIO7
#   GDO0    ->  GPIO3   (data OUT for remote_transmitter)
#   GDO2    ->  GPIO10  (data IN  for remote_receiver)
# gdo0_pin is deliberately NOT set on the cc1101 block: with dual-pin wiring that
# avoids ESPHome issue #16876 (TX emits no RF when gdo0_pin is set on ESP32).
# ---------------------------------------------------------------------------
spi:
  clk_pin: GPIO4
  mosi_pin: GPIO6
  miso_pin: GPIO5

cc1101:
  cs_pin: GPIO7
  frequency: 433.92MHz
  modulation_type: ASK/OOK
  output_power: 10          # dBm; plenty for one interior wall (antenna match matters more)

remote_transmitter:
  id: cc1101_tx
  pin: GPIO3                # GDO0
  carrier_duty_percent: 100%
  on_transmit:
    then:
      - cc1101.begin_tx
  on_complete:
    then:
      - cc1101.begin_rx

remote_receiver:
  id: cc1101_rx
  pin: GPIO10               # GDO2
  # dump: raw               # uncomment on first flash to eyeball incoming timings
  tolerance: 30%
  on_raw:
    then:
      - lambda: |-
          // Decode a received Claro frame from raw timings and reflect the button
          // press into HA state (so using a physical remote keeps HA in sync).
          // UNTESTED: mark/space thresholds and pairing may need tuning on hardware.
          const auto &t = x;               // std::vector<int32_t>, +mark / -space
          if (t.size() < 60) return;       // 33 bits ~= 66 slots; ignore short noise
          uint32_t bits = 0; int nbits = 0;
          for (size_t i = 0; i + 1 < t.size(); i += 2) {
            int mark = t[i]; int space = -t[i+1];
            if (mark < 100) continue;
            bool one;
            if (mark > 800) one = true;     // long mark  -> '1'
            else one = false;               // short mark -> '0'
            (void)space;
            bits = (bits << 1) | (one ? 1 : 0);
            if (++nbits >= 33) break;
          }
          if (nbits < 33) return;
          uint32_t payload = bits >> 1;     // drop stop bit
          uint16_t addr = (payload >> 16) & 0xFFFF;
          uint8_t  cmd  = (payload >> 8) & 0xFF;
          uint8_t  chk  = payload & 0xFF;
          if ((uint8_t)(((addr >> 8) & 0xFF) ^ (addr & 0xFF) ^ cmd) != chk) return; // bad checksum
          ESP_LOGI("claro", "RX addr=0x%04X cmd=0x%02X", addr, cmd);
          // Reflect into HA state. Fan speeds 1-6 and light-toggle handled per fan.
          bool is_a = (addr == ${addr_fan_a});
          bool is_b = (addr == ${addr_fan_b});
          if (!is_a && !is_b) return;
          auto set_speed = [&](esphome::template_::TemplateFan *f, int spd){
            auto c = f->make_call(); c.set_state(true); c.set_speed(spd); c.perform();
          };
          switch (cmd) {
            case 0xFB: set_speed(is_a ? id(fan_a) : id(fan_b), 1); break;
            case 0xF5: set_speed(is_a ? id(fan_a) : id(fan_b), 2); break;
            case 0xF7: set_speed(is_a ? id(fan_a) : id(fan_b), 3); break;
            case 0xF3: set_speed(is_a ? id(fan_a) : id(fan_b), 4); break;
            case 0xF9: set_speed(is_a ? id(fan_a) : id(fan_b), 5); break;
            case 0xFA: set_speed(is_a ? id(fan_a) : id(fan_b), 6); break;
            case 0xF4: { auto f = is_a ? id(fan_a) : id(fan_b); auto c = f->turn_off(); c.perform(); } break;  // FAN/OFF
            case 0xFC: {  // light toggle
              auto lt = is_a ? id(light_a) : id(light_b);
              auto c = lt->toggle(); c.perform();
            } break;
            default: break;  // dim/cct/timer/breeze/power: logged, no state model
          }

# ---------------------------------------------------------------------------
# Transmit helper: compose + send one Claro frame from address + command byte.
# This is the whole protocol in ~15 lines — every button of both fans routes
# through here, so fan B needs no captured codes (derived from its address).
# ---------------------------------------------------------------------------
script:
  - id: send_claro
    parameters:
      address: int
      command: int
    then:
      - lambda: |-
          uint8_t ah = (address >> 8) & 0xFF;
          uint8_t al = address & 0xFF;
          uint8_t chk = ah ^ al ^ (command & 0xFF);
          uint32_t payload = ((uint32_t)(address & 0xFFFF) << 16)
                           | ((uint32_t)(command & 0xFF) << 8) | chk;
          auto call = id(cc1101_tx).transmit();
          auto *d = call.get_data();
          d->set_carrier_frequency(0);              // pure OOK, no sub-carrier
          for (int i = 31; i >= 0; i--) {
            if ((payload >> i) & 1) d->item(1192, 380);   // '1'
            else                    d->item(412, 1164);   // '0'
          }
          d->item(1192, 11932);                      // stop bit '1' + inter-frame gap
          call.set_send_times(6);                    // factory sends ~4; 6 is safe
          call.set_send_wait(0);
          call.perform();

# ---------------------------------------------------------------------------
# Entities — Fan A. (Fan B below is identical bar the address substitution.)
# ---------------------------------------------------------------------------
fan:
  - platform: template
    id: fan_a
    name: "Fan A"
    speed_count: 6
    has_direction: true
    on_turn_off:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xF4   # FAN/OFF
    on_speed_set:
      - lambda: |-
          static const uint8_t codes[7] = {0, 0xFB,0xF5,0xF7,0xF3,0xF9,0xFA};
          int s = id(fan_a).speed;
          if (s >= 1 && s <= 6) id(send_claro)->execute(${addr_fan_a}, codes[s]);
    on_direction_set:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xEA   # F/R toggle
  - platform: template
    id: fan_b
    name: "Fan B"
    speed_count: 6
    has_direction: true
    on_turn_off:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xF4
    on_speed_set:
      - lambda: |-
          static const uint8_t codes[7] = {0, 0xFB,0xF5,0xF7,0xF3,0xF9,0xFA};
          int s = id(fan_b).speed;
          if (s >= 1 && s <= 6) id(send_claro)->execute(${addr_fan_b}, codes[s]);
    on_direction_set:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xEA

# Lights: the fan light is a hardware TOGGLE with no state feedback over RF, so we
# model on/off as an optimistic binary light. Brightness (relative Dim +/-) and
# colour temperature (3 discrete presets) are exposed as buttons / a select rather
# than a slider that would imply precision we don't have.
light:
  - platform: binary
    id: light_a
    name: "Fan A Light"
    output: light_a_out
  - platform: binary
    id: light_b
    name: "Fan B Light"
    output: light_b_out

output:
  - platform: template
    id: light_a_out
    type: binary
    write_action:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xFC   # light toggle
  - platform: template
    id: light_b_out
    type: binary
    write_action:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xFC

select:
  - platform: template
    id: cct_a
    name: "Fan A Light Colour"
    optimistic: true
    options: ["Warm", "Natural", "Cool"]
    on_value:
      - lambda: |-
          uint8_t c = i == 0 ? 0xF8 : (i == 1 ? 0xFD : 0xF6);   // warm / natural / cool
          id(send_claro)->execute(${addr_fan_a}, c);
  - platform: template
    id: cct_b
    name: "Fan B Light Colour"
    optimistic: true
    options: ["Warm", "Natural", "Cool"]
    on_value:
      - lambda: |-
          uint8_t c = i == 0 ? 0xF8 : (i == 1 ? 0xFD : 0xF6);
          id(send_claro)->execute(${addr_fan_b}, c);

button:
  - platform: template
    name: "Fan A Light Brighter"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xF0
  - platform: template
    name: "Fan A Light Dimmer"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xF2
  - platform: template
    name: "Fan A Breeze"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_a}
          command: 0xEC
  - platform: template
    name: "Fan B Light Brighter"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xF0
  - platform: template
    name: "Fan B Light Dimmer"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xF2
  - platform: template
    name: "Fan B Breeze"
    on_press:
      - script.execute:
          id: send_claro
          address: ${addr_fan_b}
          command: 0xEC
